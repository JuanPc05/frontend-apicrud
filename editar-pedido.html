<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Admin - Editar Pedido</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">

    <div id="wrapper">

        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-laugh-wink"></i>
                </div>
                <div class="sidebar-brand-text mx-3">Tienda</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item">
                <a class="nav-link" href="index.html">
                    <i class="fas fa-fw fa-tachometer-alt"></i>
                    <span>Dashboard</span></a>
            </li>
            <hr class="sidebar-divider">
            <div class="sidebar-heading">Módulos</div>
            <li class="nav-item">
                <a class="nav-link collapsed" href="#" data-toggle="collapse" data-target="#collapsePedidos"
                    aria-expanded="true" aria-controls="collapsePedidos">
                    <i class="fas fa-fw fa-shopping-cart"></i>
                    <span>Pedidos</span>
                </a>
                <div id="collapsePedidos" class="collapse show" aria-labelledby="headingPedidos" data-parent="#accordionSidebar">
                    <div class="bg-white py-2 collapse-inner rounded">
                        <h6 class="collapse-header">Acciones:</h6>
                        <a class="collapse-item" href="listado-pedidos.html">Ver Pedidos</a>
                        <a class="collapse-item" href="crear-pedido.html">Crear Pedidos</a>
                    </div>
                </div>
            </li>
            <hr class="sidebar-divider">
            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>
        </ul>

        <div id="content-wrapper" class="d-flex flex-column">

            <div id="content">

                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>
                </nav>

                <div class="container-fluid">

                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Editar Pedido</h1>
                        <a href="listado-pedidos.html" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                            <i class="fas fa-list fa-sm text-white-50"></i> Listado </a>
                    </div>

                    <div class="row">
                        <div class="col-8">
                            <form id="formulario-editar-pedido">
                            
                                <!-- Cliente select -->
                                <div class="form-outline mb-4">
                                    <select id="id_cliente" class="form-control" required>
                                        <option selected disabled>Seleccionar Cliente</option>
                                    </select>
                                    <label class="form-label" for="id_cliente">Cliente</label>
                                </div>

                                <!-- Método de pago select -->
                                <div class="form-outline mb-4">
                                    <select id="metodo_pago" class="form-control" required>
                                        <option selected disabled>Seleccionar Método de Pago</option>
                                        <option value="Efectivo">Efectivo</option>
                                        <option value="PSE">PSE</option>
                                        <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                                        <option value="Transferencia">Transferencia</option>
                                        <option value="Nequi">Nequi</option>
                                    </select>
                                    <label class="form-label" for="metodo_pago">Método de Pago</label>
                                </div>

                                <!-- Productos del pedido (Carrito) -->
                                <div class="form-outline mb-4">
                                    <h5>Productos del Pedido</h5>
                                    
                                    <div class="row mb-3">
                                        <div class="col-8">
                                            <select id="select-productos" class="form-control">
                                                <option selected disabled>Seleccionar Producto</option>
                                            </select>
                                        </div>
                                        <div class="col-4">
                                            <button type="button" id="btn-agregar-producto" class="btn btn-success btn-block">Agregar</button>
                                        </div>
                                    </div>

                                    <table class="table" id="tabla-carrito">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Producto</th>
                                                <th>Precio</th>
                                                <th>Cantidad</th>
                                                <th>Subtotal</th>
                                                <th>Acción</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Se cargan dinámicamente -->
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Descuento input (%) -->
                                <div class="form-outline mb-4">
                                    <input type="number" id="descuento" class="form-control" value="0" min="0" max="100" />
                                    <label class="form-label" for="descuento">Descuento (%)</label>
                                </div>

                                <!-- Aumento input -->
                                <div class="form-outline mb-4">
                                    <input type="number" id="aumento" class="form-control" value="0" min="0" />
                                    <label class="form-label" for="aumento">Aumento/Envío ($)</label>
                                </div>

                                <!-- Total display -->
                                <div class="alert alert-info" role="alert">
                                    <h5>Total a Pagar: <span id="total-pedido">$0</span></h5>
                                </div>
                            
                                <!-- Botones de Guardar y Cancelar -->
                                <button type="submit" class="btn btn-primary btn-block mb-2">Guardar Cambios</button>
                                <a href="listado-pedidos.html" class="btn btn-secondary btn-block mb-4">Cancelar</a>
                            </form>
                        </div>
                    </div>

                </div>

            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; Tienda de Comidas 2026</span>
                    </div>
                </div>
            </footer>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>
    
    <script src="js/editar-pedido.js"></script>

</body>

</html>
